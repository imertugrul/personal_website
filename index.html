<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muhammet Ertuğrul | CS Educator &amp; AI Consultant</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://mrertugrul.com/en/">
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f4f5f7; color: #1a1a2e; gap: 1rem; }
    p { margin: 0; font-size: 0.95rem; color: #555; }
    .links { display: flex; gap: 1rem; }
    a { color: #1a1a2e; text-decoration: none; padding: 0.4rem 0.9rem; border: 1px solid #1a1a2e; border-radius: 4px; font-size: 0.9rem; }
    a:hover { background: #1a1a2e; color: #fff; }
  </style>
  <script>
    (function () {
      var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
      var dest = lang === 'tr' ? '/tr/' : lang === 'de' ? '/de/' : '/en/';
      window.location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>Redirecting…</p>
  <div class="links">
    <a href="/en/">View in English</a>
    <a href="/de/">Deutsch ansehen</a>
    <a href="/tr/">Türkçe görüntüle</a>
  </div>
</body>
</html>
